<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>毛茸清单 · 桌面宠物框架 v2（看书 / 敲键盘）</title>
<style>
  :root{ --accent:#A898FA; --accent-d:#7E6FD6; --ink-2:#8A847B; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:-apple-system,"PingFang SC","Noto Serif SC",serif; overflow:hidden;}

  /* 预览用的“假桌面”背景；真机没有背景，宠物直接浮在你的桌面上 */
  .desk{position:fixed; inset:0;
    background:linear-gradient(160deg,#cfe3f0 0%,#e7e0f3 45%,#f6e9e0 100%);}
  .desk::before{content:"🖥 你的桌面（预览背景 · 真机无此背景）"; position:absolute; top:14px; left:50%;
    transform:translateX(-50%); font-size:12px; color:rgba(60,50,90,.5); letter-spacing:1px;}

  /* 宠物：可拖动、可点击，无框无底；默认全身看书素材（透明动图）——按动图宽高比自适应 */
  .pet{position:absolute; left:calc(50% - 130px); top:calc(50% - 90px); width:260px;
    cursor:grab; user-select:none; touch-action:none; transition:filter .15s; z-index:5;}
  .pet:active{cursor:grabbing;}
  .pet img{display:block;width:100%;height:auto; pointer-events:none;
    filter:drop-shadow(0 14px 20px rgba(80,60,120,.28));}
  .pet.bob{animation:bob 3s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

  /* 专注态：宠物脚下小计时牌 */
  .focusTag{position:absolute; left:50%; top:calc(100% + 6px); transform:translateX(-50%);
    background:rgba(127,111,214,.92); color:#fff; font-size:13px; padding:5px 14px; border-radius:14px;
    white-space:nowrap; opacity:0; transition:opacity .2s; pointer-events:none; letter-spacing:1px;}
  .focusTag.show{opacity:1;}

  /* 点击宠物弹出的按钮（浮在宠物上方） */
  .menu{position:absolute; display:flex; gap:10px; padding:10px 12px; border-radius:22px;
    background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
    box-shadow:0 12px 30px rgba(80,60,120,.25); transform:scale(.6); opacity:0;
    transform-origin:bottom center; transition:transform .22s cubic-bezier(.2,.9,.25,1), opacity .18s;
    pointer-events:none; z-index:10;}
  .menu.show{transform:scale(1); opacity:1; pointer-events:auto;}
  .mbtn{width:58px; flex:none; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;}
  .mbtn .ic{width:50px;height:50px;border-radius:16px; background:#fff; color:#2D2A26; display:flex;align-items:center;justify-content:center;
    font-size:22px; box-shadow:0 5px 14px rgba(120,100,160,.18); border:1px solid rgba(168,152,250,.4); transition:transform .12s, background .12s;}
  .mbtn .ic svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;}
  .mbtn:active .ic{transform:scale(.88); background:#F3EFFF;}
  .mbtn .lb{font-size:11px; color:var(--ink-2);}
  .mbtn.switch .ic{background:var(--accent); color:#fff; border-color:transparent;}
  .mbtn.on .ic{background:var(--accent-d); color:#fff; border-color:transparent;}

  /* 子面板占位（点功能按钮时滑入） */
  .panel{position:fixed; right:22px; top:22px; width:340px; max-height:80vh; background:#F6F4EF;
    border-radius:22px; box-shadow:0 24px 60px rgba(60,50,90,.3); overflow:hidden;
    transform:translateX(120%); transition:transform .3s cubic-bezier(.2,.9,.25,1); display:flex; flex-direction:column;}
  .panel.show{transform:none;}
  .panel-head{height:50px; display:flex; align-items:center; gap:10px; padding:0 16px; border-bottom:1px solid rgba(0,0,0,.06);}
  .back{font-size:14px; color:var(--accent-d); cursor:pointer;}
  .panel-title{font-size:16px; font-weight:600; letter-spacing:1px;}
  .panel-body{padding:18px; color:var(--ink-2); line-height:1.8; overflow:auto;}
  .ph-card{background:#fff; border-radius:14px; padding:16px; margin-bottom:10px; font-size:13px; color:#a9a29a;
    box-shadow:0 4px 12px rgba(120,100,160,.08);}
  .ph-tag{display:inline-block; font-size:10px; color:var(--accent-d); background:#F3EFFF; border-radius:7px; padding:2px 8px; margin-bottom:8px;}

  /* 右下注解 */
  .notes{position:fixed; right:22px; bottom:22px; width:320px; background:rgba(255,255,255,.94);
    border-radius:16px; padding:16px 18px; font-size:13px; line-height:1.75; color:#5b554d;
    box-shadow:0 10px 30px rgba(60,50,90,.18);}
  .notes b{color:var(--accent-d);}
  .notes .tag{font-size:11px; color:#fff; background:var(--accent); border-radius:7px; padding:2px 9px; display:inline-block; margin-bottom:8px;}
  .notes ul{margin:8px 0 0 16px;} .notes li{margin-bottom:6px;}
  .notes .k{display:inline-block; min-width:54px; color:#fff; background:#7E6FD6; border-radius:6px; text-align:center; font-size:11px; padding:1px 6px; margin-right:6px;}
</style>
</head>
<body>
  <div class="desk">
    <!-- 默认：全身看书动图（-read.gif，CDN；离线回落 -read.png 静态） -->
    <div class="pet bob" id="pet">
      <img id="petImg" alt="">
      <div class="focusTag" id="focusTag">专注中 25:00</div>
    </div>
    <div class="menu" id="menu">
      <div class="mbtn switch" data-act="switch"><div class="ic"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v5h-5"/></svg></div><div class="lb">切换宠物</div></div>
      <div class="mbtn" data-act="today"><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v13a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V6A1.5 1.5 0 0 1 5 4.5z"/><path d="M8 9.5l1.5 1.5L12.5 8"/><path d="M8 14.5h6"/></svg></div><div class="lb">今日</div></div>
      <div class="mbtn" data-act="focus"><div class="ic"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="3"/><circle cx="6.5" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="13.5" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="17" cy="10" r="1.1" fill="currentColor" stroke="none"/><path d="M7.5 15h9"/></svg></div><div class="lb">专注</div></div>
      <div class="mbtn" data-act="calendar"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17"/><path d="M8 3.5v3.5"/><path d="M16 3.5v3.5"/><path d="M9.5 14h5"/></svg></div><div class="lb">日历</div></div>
    </div>
  </div>

  <div class="panel" id="panel">
    <div class="panel-head"><span class="back" onclick="closePanel()">← 收起</span><span class="panel-title" id="panelTitle"></span></div>
    <div class="panel-body" id="panelBody"></div>
  </div>

  <div class="notes">
    <span class="tag">桌面宠物框架 · 待确认</span>
    <ul>
      <li><b>无框无背景</b>：真机透明 + 无边框 + 置顶，宠物直接浮在桌面。</li>
      <li><b>默认素材 = 全身看书动图（透明）</b>：<code>*-read.gif</code> 白底已抠成透明通道，宠物直接浮在桌面。</li>
      <li><b>点「专注」→ 直接切敲键盘</b>：宠物换成 <code>&lt;pet&gt;-laptop.gif</code>（CDN 动图，离线回落看书图），脚下出现专注计时牌。</li>
      <li><b>可拖动</b> + <b>点宠物弹 4 按钮</b>（切换宠物 / 今日 / 专注 / 日历）。<b>无聊天</b>。</li>
      <li>今日 / 日历 为占位面板，确认后填真实功能。</li>
    </ul>
  </div>

<script>
  const CDN = 'https://636c-cloud1-d4gck1kjyb8ca2456-1461749586.tcb.qcloud.la/pets/anim/';
  // readGif = 全身看书动图（本地透明）；readPng = 静态兜底；laptop = 敲键盘动图（本地透明）
  const PETS = [
    {key:'orange',name:'橘小满'},{key:'aries',name:'白羊'},{key:'taurus',name:'金牛'},{key:'gemini',name:'双子'},
    {key:'cancer',name:'巨蟹'},{key:'leo',name:'狮子'},{key:'virgo',name:'处女'},{key:'libra',name:'天秤'},
    {key:'scorpio',name:'天蝎'},{key:'sagittarius',name:'射手'},{key:'capricorn',name:'摩羯'},{key:'aquarius',name:'水瓶'},{key:'pisces',name:'双鱼'}
  ].map(p=>({...p,
    readGif: './public/pets/'+p.key+'-read.gif',   // 本地透明动图（白底已抠）
    readPng: './public/pets/'+p.key+'-read.png',   // 静态兜底
    laptop:  './public/pets/'+p.key+'-laptop.gif'  // 本地透明敲键盘动图
  }));

  let idx=0, menuOpen=false, focusOn=false, timer=null, remain=25*60;
  const pet=document.getElementById('pet'), menu=document.getElementById('menu'), desk=document.querySelector('.desk');
  const petImg=document.getElementById('petImg'), focusTag=document.getElementById('focusTag');

  function setPet(kind){ // 'read' | 'laptop'
    const p=PETS[idx];
    if(kind==='laptop'){
      petImg.onerror=()=>{petImg.onerror=null;petImg.src=p.readPng;};
      petImg.src=p.laptop;
    } else {
      petImg.onerror=()=>{petImg.onerror=null;petImg.src=p.readPng;};
      petImg.src=p.readGif;
    }
  }
  setPet('read'); // 默认播放看书动图

  // 拖动 vs 点击
  let down=false, moved=false, sx=0, sy=0, ox=0, oy=0;
  pet.addEventListener('pointerdown',e=>{ if(focusOn) return; // 专注态不拖动
    down=true;moved=false;sx=e.clientX;sy=e.clientY;ox=pet.offsetLeft;oy=pet.offsetTop;pet.setPointerCapture(e.pointerId);pet.classList.remove('bob');});
  pet.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
    const w=pet.offsetWidth,h=pet.offsetHeight;
    pet.style.left=Math.max(0,Math.min(innerWidth-w,ox+dx))+'px';pet.style.top=Math.max(0,Math.min(innerHeight-h,oy+dy))+'px';});
  pet.addEventListener('pointerup',()=>{down=false; if(!moved) toggleMenu(); else pet.classList.add('bob');});

  function positionMenu(){ const r=pet.getBoundingClientRect();
    menu.style.left=(r.left+r.width/2-110)+'px'; menu.style.top=(r.top-72)+'px'; }
  function toggleMenu(){ menuOpen=!menuOpen; if(menuOpen) positionMenu(); menu.classList.toggle('show',menuOpen); }

  menu.addEventListener('click',e=>{
    const b=e.target.closest('.mbtn'); if(!b)return; const act=b.dataset.act;
    if(act==='switch'){ idx=(idx+1)%PETS.length; if(focusOn) setPet('laptop'); else setPet('read'); positionMenu(); }
    else if(act==='focus'){ toggleFocus(); }
    else { openPanel(act); }
  });
  desk.addEventListener('pointerdown',e=>{ if(menuOpen && !menu.contains(e.target) && e.target!==pet && !pet.contains(e.target)){menuOpen=false;menu.classList.remove('show');} });

  // 专注：直接切敲键盘素材 + 计时牌
  function toggleFocus(){
    focusOn=!focusOn;
    document.querySelector('.mbtn[data-act="focus"]').classList.toggle('on',focusOn);
    if(focusOn){
      setPet('laptop'); focusTag.classList.add('show'); remain=25*60; tick();
      timer=setInterval(tick,1000);
      menuOpen=false; menu.classList.remove('show');
    } else {
      setPet('read'); focusTag.classList.remove('show'); clearInterval(timer); timer=null;
    }
  }
  function tick(){ remain--; if(remain<0){ toggleFocus(); return; }
    const m=String(Math.floor(remain/60)).padStart(2,'0'), s=String(remain%60).padStart(2,'0');
    focusTag.textContent='专注中 '+m+':'+s; }

  const PANELS={
    today:{t:'今日待办',h:['今日任务列表','完成沉底动画','左滑删除','新增待办']},
    calendar:{t:'日历',h:['月历足迹（宠物 glyph）','待办圆点','当日详情']}
  };
  function openPanel(act){ const P=PANELS[act]; document.getElementById('panelTitle').textContent=P.t;
    document.getElementById('panelBody').innerHTML=`<span class="ph-tag">占位 · 确认后填充</span>`+P.h.map(x=>`<div class="ph-card">${x}</div>`).join('');
    document.getElementById('panel').classList.add('show'); menuOpen=false; menu.classList.remove('show'); }
  function closePanel(){ document.getElementById('panel').classList.remove('show'); }
</script>
</body>
</html>
